version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dnevnik
      POSTGRES_PASSWORD: dnevnik
      POSTGRES_DB: dnevnik
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://dnevnik:dnevnik@db:5432/dnevnik
      JWT_SECRET: dev-secret
      LLM_STUB: ${LLM_STUB:-0}
    ports:
      - "4000:4000"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data:
